enableGerritTriggerDescription=This option allows BFA to forward the description of the found causes to the Gerrit-Trigger-plugin, ultimately allowing users to see their build issues directly inside Gerrit.
nrOfScanThreadsDescription=Number of threads per build to use when scanning the failed builds.
testResultParsingEnabledDescription=Treat failed test cases (as indicated by JUnit/xUnit/... publishers) as failure causes.
testResultCategoriesDescription=A space-separated list of categories to use for failure causes representing failed test cases.
maxLogSize=Log file with size that exceeds limit (in MB) would not be scanned, 0 - disables this check
fallbackCategoriesDescription=Space separated list of category names that marks fallback causes. Fallback causes will only be applied if there are no non-fallback causes found.
metricSquashingEnabledDescription=Prevents a single failed build from counting categories multiple times if multiple failures causes are identified with the same categories.
scanTimeoutFileSecondsDescription=Per-pattern timeout for scanning a whole log file. Increase for very large console logs (default 120). 0 keeps the default. Override at runtime via -Dcom.sonyericsson.jenkins.plugins.bfa.scan.timeoutFileMs=<ms>.
scanTimeoutLineSecondsDescription=Timeout for matching a single line against a regex pattern (default 10). 0 keeps the default. Override at runtime via -Dcom.sonyericsson.jenkins.plugins.bfa.scan.timeoutLineMs=<ms>.
scanTimeoutBlockSecondsDescription=Timeout for scanning a single multi-line block (default 30). 0 keeps the default. Override at runtime via -Dcom.sonyericsson.jenkins.plugins.bfa.scan.timeoutBlockMs=<ms>.
pipelineStepBasedScanEnabledDescription=When enabled (default), Pipeline (WorkflowRun) builds are analyzed step-by-step: BFA reads only the logs of failed steps instead of the entire console log. This dramatically reduces I/O on large pipelines and avoids per-file scan timeouts. Falls back to the full log when no failed step is found, when the Pipeline plugin is not installed, or when narrowing fails for any reason.
